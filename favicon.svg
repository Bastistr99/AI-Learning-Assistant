<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
    </filter>
  </defs>
  
  <!-- Background: Dark Primary -->
  <rect width="128" height="128" rx="32" fill="#1A1A1A"/>
  
  <!-- Yellow Glow Blob (Simulating the blur-3xl effect) -->
  <circle cx="100" cy="20" r="45" fill="#CCFF00" fill-opacity="0.6" filter="url(#f1)"/>
  
  <!-- Triangle -->
  <g transform="translate(64, 64) rotate(12) translate(-64, -64)">
    <polygon points="40,28 96,64 40,100" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>